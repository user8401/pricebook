<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2b53">
<title>Pricebook</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{--ink:#1d2b53;--paper:#f6f7f2;--tag:#ffd23f;--line:#d9dccf;--card:#fff;--mute:#5d6685;--danger:#b3261e}
@media (prefers-color-scheme:dark){:root{--ink:#e8ebff;--paper:#11172e;--card:#1a2142;--line:#2c3566;--mute:#9aa4d0;--danger:#ff8a80}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Trebuchet MS",system-ui,sans-serif;background:var(--paper);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);line-height:1.4}
header{background:#1d2b53;color:#fff;padding:18px 16px 14px}
header h1{margin:0;font-size:24px;letter-spacing:.2px}
header p{margin:2px 0 0;color:#c9d0f0;font-size:14px}
main{max-width:560px;margin:0 auto;padding:16px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;border:0;border-radius:10px;padding:12px 14px;background:#1d2b53;color:#fff;cursor:pointer;min-height:46px}
@media (prefers-color-scheme:dark){button,.btn{background:#3b4a8f}}
button.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button.tag{background:var(--tag);color:#1d2b53;font-weight:700}
button.small{min-height:36px;padding:6px 10px;font-size:14px}
button:focus-visible,input:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input[type=text],input[type=number],input[type=search]{width:100%;font:inherit;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
#preview{width:100%;max-height:300px;object-fit:cover;border-radius:10px;margin-top:10px;display:none}
.status{font-size:14px;margin-top:8px;color:var(--mute)}
.status.ok{color:#1b7f3b}
.item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:none;background:var(--line)}
.item h3{margin:0 0 4px;font-size:16px}
.price{display:inline-block;background:var(--tag);color:#1d2b53;font-weight:800;padding:2px 10px 2px 14px;border-radius:4px 14px 14px 4px;clip-path:polygon(8px 0,100% 0,100% 100%,8px 100%,0 50%)}
.meta{font-size:13px;color:var(--mute);margin-top:4px}
.meta a{color:inherit}
.actions{display:flex;gap:8px;margin-top:6px}
.del{color:var(--danger)}
.total{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}
.empty{color:var(--mute);text-align:center;padding:18px 0}
</style>
</head>
<body>
<header>
  <h1>Pricebook</h1>
  <p>Snap it, price it, find it again.</p>
</header>
<main>
  <section>
    <h2>Add an item</h2>
    <div class="row">
      <button id="btnCam" type="button">Take photo</button>
      <button id="btnGal" type="button" class="alt">Pick from gallery</button>
    </div>
    <input id="fileCam" type="file" accept="image/*" capture="environment" hidden>
    <input id="fileGal" type="file" accept="image/*" hidden>
    <img id="preview" alt="Preview of the selected photo">
    <div id="locStatus" class="status" role="status">Add a photo and its location fills in automatically.</div>
    <div class="row" style="margin-top:8px"><button id="btnLoc" type="button" class="alt small">Use my current location</button></div>

    <label for="name">Item</label>
    <input id="name" type="text" placeholder="e.g. Gold bracelet" autocomplete="off">
    <label for="price">Price</label>
    <input id="price" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
    <label for="note">Shop or note (optional)</label>
    <input id="note" type="text" autocomplete="off">
    <div class="row" style="margin-top:14px"><button id="btnSave" type="button" class="tag">Save item</button></div>
  </section>

  <section>
    <h2>Saved items</h2>
    <input id="search" type="search" placeholder="Search items, places, notes">
    <div class="total" style="margin-top:12px"><span id="count">0 items</span><span>Total <span class="price" id="total">0</span></span></div>
    <div id="list"></div>
    <div class="row" style="margin-top:10px"><button id="btnCsv" type="button" class="alt small">Export CSV</button></div>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let photoBlob = null, loc = null;

  /* ---------- IndexedDB ---------- */
  const dbp = new Promise((res, rej) => {
    const r = indexedDB.open('pricebook', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('items', {keyPath: 'id', autoIncrement: true});
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => {
    const db = await dbp;
    return new Promise((res, rej) => {
      const t = db.transaction('items', mode), s = t.objectStore('items'), q = fn(s);
      t.oncomplete = () => res(q && q.result);
      t.onerror = () => rej(t.error);
    });
  };
  const allItems = () => tx('readonly', s => s.getAll());

  /* ---------- EXIF GPS reader ---------- */
  function exifGps(buf) {
    try {
      const v = new DataView(buf);
      if (v.getUint16(0) !== 0xFFD8) return null;
      let o = 2;
      while (o < v.byteLength - 4) {
        const m = v.getUint16(o), len = v.getUint16(o + 2);
        if (m === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) return tiffGps(v, o + 10);
        if (m === 0xFFDA || (m & 0xFF00) !== 0xFF00) break;
        o += 2 + len;
      }
    } catch (e) {}
    return null;
  }
  function tiffGps(v, t) {
    const le = v.getUint16(t) === 0x4949;
    const u16 = p => v.getUint16(p, le), u32 = p => v.getUint32(p, le);
    const ifd0 = t + u32(t + 4);
    let gps = 0;
    for (let i = 0, n = u16(ifd0); i < n; i++) {
      const e = ifd0 + 2 + i * 12;
      if (u16(e) === 0x8825) gps = t + u32(e + 8);
    }
    if (!gps) return null;
    const tags = {};
    for (let i = 0, n = u16(gps); i < n; i++) {
      const e = gps + 2 + i * 12, tag = u16(e);
      if (tag === 1 || tag === 3) tags[tag] = String.fromCharCode(v.getUint8(e + 8));
      if (tag === 2 || tag === 4) {
        const p = t + u32(e + 8);
        const r = [0, 1, 2].map(k => u32(p + k * 8) / (u32(p + k * 8 + 4) || 1));
        tags[tag] = r[0] + r[1] / 60 + r[2] / 3600;
      }
    }
    if (tags[2] == null || tags[4] == null) return null;
    const lat = tags[1] === 'S' ? -tags[2] : tags[2];
    const lng = tags[3] === 'W' ? -tags[4] : tags[4];
    if (!isFinite(lat) || !isFinite(lng) || (lat === 0 && lng === 0)) return null;
    return {lat, lng};
  }

  /* ---------- Location helpers ---------- */
  const setStatus = (msg, ok) => { const s = $('locStatus'); s.textContent = msg; s.className = 'status' + (ok ? ' ok' : ''); };
  async function placeName(lat, lng) {
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=16&lat=${lat}&lon=${lng}`);
      const j = await r.json();
      return j.display_name ? j.display_name.split(',').slice(0, 3).join(',').trim() : '';
    } catch (e) { return ''; }
  }
  async function useLocation(l, source) {
    loc = {lat: l.lat, lng: l.lng, place: ''};
    setStatus(`Location from ${source}: ${l.lat.toFixed(5)}, ${l.lng.toFixed(5)}`, true);
    loc.place = await placeName(l.lat, l.lng);
    if (loc.place) setStatus(`Location from ${source}: ${loc.place}`, true);
  }
  function deviceLocation() {
    if (!navigator.geolocation) { setStatus('This browser cannot read your location.'); return; }
    setStatus('Getting your current location...');
    navigator.geolocation.getCurrentPosition(
      p => useLocation({lat: p.coords.latitude, lng: p.coords.longitude}, 'your device'),
      () => setStatus('Could not get location. Allow location access for this site, then tap "Use my current location".'),
      {enableHighAccuracy: true, timeout: 15000, maximumAge: 60000});
  }

  /* ---------- Photo handling ---------- */
  async function shrink(file, max = 1200) {
    const bmp = await createImageBitmap(file, {imageOrientation: 'from-image'});
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
  }
  async function onPhoto(file) {
    if (!file) return;
    loc = null;
    const gps = exifGps(await file.arrayBuffer());
    photoBlob = await shrink(file);
    const img = $('preview');
    img.src = URL.createObjectURL(photoBlob);
    img.style.display = 'block';
    if (gps) await useLocation(gps, 'photo');
    else { setStatus('This photo has no location data. Using your current location instead...'); deviceLocation(); }
  }

  /* ---------- Save / render ---------- */
  async function save() {
    const name = $('name').value.trim(), price = parseFloat($('price').value);
    if (!photoBlob) return alert('Add a photo first.');
    if (!name) return alert('Enter the item name.');
    if (!isFinite(price)) return alert('Enter the price.');
    await tx('readwrite', s => s.add({name, price, note: $('note').value.trim(), photo: photoBlob, loc, date: Date.now()}));
    photoBlob = null; loc = null;
    ['name', 'price', 'note'].forEach(i => $(i).value = '');
    $('preview').style.display = 'none';
    setStatus('Saved. Add another photo to continue.', true);
    render();
  }
  const urls = [];
  async function render() {
    urls.splice(0).forEach(URL.revokeObjectURL);
    const q = $('search').value.toLowerCase();
    const items = (await allItems()).sort((a, b) => b.date - a.date)
      .filter(i => !q || [i.name, i.note, i.loc && i.loc.place].join(' ').toLowerCase().includes(q));
    $('count').textContent = items.length + (items.length === 1 ? ' item' : ' items');
    $('total').textContent = items.reduce((s, i) => s + i.price, 0).toLocaleString(undefined, {maximumFractionDigits: 2});
    const list = $('list'); list.innerHTML = '';
    if (!items.length) { list.innerHTML = '<div class="empty">Nothing saved yet. Add your first item above.</div>'; return; }
    for (const i of items) {
      const u = URL.createObjectURL(i.photo); urls.push(u);
      const d = document.createElement('div'); d.className = 'item';
      const map = i.loc ? `<a href="https://www.google.com/maps?q=${i.loc.lat},${i.loc.lng}" target="_blank" rel="noopener">${esc(i.loc.place || 'Open on map')}</a>` : 'No location';
      d.innerHTML = `<img src="${u}" alt="${esc(i.name)}"><div style="flex:1;min-width:0">
        <h3>${esc(i.name)}</h3><span class="price">${i.price.toLocaleString(undefined, {maximumFractionDigits: 2})}</span>
        <div class="meta">${map}<br>${new Date(i.date).toLocaleString()}${i.note ? '<br>' + esc(i.note) : ''}</div>
        <div class="actions"><button class="alt small del" data-id="${i.id}" type="button">Delete</button></div></div>`;
      list.appendChild(d);
    }
  }
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

  $('list').addEventListener('click', async e => {
    const id = e.target.dataset && e.target.dataset.id;
    if (id && confirm('Delete this item?')) { await tx('readwrite', s => s.delete(Number(id))); render(); }
  });
  $('btnCsv').onclick = async () => {
    const rows = [['Item', 'Price', 'Note', 'Place', 'Latitude', 'Longitude', 'Date']];
    (await allItems()).forEach(i => rows.push([i.name, i.price, i.note, i.loc ? i.loc.place : '', i.loc ? i.loc.lat : '', i.loc ? i.loc.lng : '', new Date(i.date).toISOString()]));
    const csv = rows.map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
    a.download = 'pricebook.csv'; a.click();
  };
  $('btnCam').onclick = () => $('fileCam').click();
  $('btnGal').onclick = () => $('fileGal').click();
  $('fileCam').onchange = e => onPhoto(e.target.files[0]);
  $('fileGal').onchange = e => onPhoto(e.target.files[0]);
  $('btnLoc').onclick = deviceLocation;
  $('btnSave').onclick = save;
  $('search').oninput = render;

  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  render();
})();
</script>
</body>
</html>
